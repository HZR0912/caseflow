name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  OPA_VERSION: "1.4.2"

jobs:
  # 1) 零外部依赖：lint + 单测。任何 PR 都必须先过这一关。
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen --extra dev
      - name: Ruff 格式检查
        run: uv run ruff format --check .
      - name: Ruff 静态检查
        run: uv run ruff check .
      - name: 单元测试（不含 integration）
        run: uv run pytest -m "not integration" -q

  # 2) 检索评测：零外部依赖（本地 BM25 + 哈希向量）。改了切块/分词/融合/版本解析
  #    之后，这一步会立刻告诉你检索质量有没有退化。
  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen --extra dev
      - name: 知识库检索评测（recall@5 / MRR / 版本冲突）
        run: uv run python -m eval.run_rag_eval --json eval/rag_eval_offline.json
      - name: W3 演示脚本自检
        run: uv run python -m scripts.w3_rag_demo --check

  # 3) 护栏评测：零外部依赖（纯规则）。拦截率或误拦率变差即红灯——
  #    这一关防的是"改一条正则把已经能拦的攻击放过去"。
  guardrails-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen --extra dev
      - name: 护栏评测（拦截率 ≥95%，误拦 <5%）
        run: uv run python -m eval.run_guardrails_eval --json eval/guardrails_eval.json
      - name: 留出集报告（不设门禁，只记录泛化能力）
        run: uv run python -m eval.run_guardrails_eval --cases data/guardrails/cases_holdout.yaml
      - name: W4 演示脚本自检
        run: uv run python -m scripts.w4_guardrails_demo --check

  # 4) 策略单测：opa test 是策略层的 pytest 等价物。
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Rego 格式检查
        run: opa fmt --diff --fail policies
      - name: Rego 单测
        run: opa test policies -v

  # 5) 真 postgres：迁移往返、checkpoint 恢复、MockCorp 并发事务及 HTTP 超时重启。
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: caseflow
          POSTGRES_PASSWORD: caseflow_dev_pw
          POSTGRES_DB: caseflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseflow -d caseflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://caseflow:caseflow_dev_pw@127.0.0.1:5432/caseflow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen --extra dev
      - name: 迁移 upgrade head
        run: uv run alembic upgrade head
      - name: 迁移可回滚（downgrade -> upgrade）
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: 集成测试
        run: uv run pytest -m integration -q
